# The Docker image (Dockerfile) on GitHub Container Registry: ghcr.io/hubertdungen/grimorio:<version> and :latest,
# for every v* tag (amd64 and arm64: mini PCs, Raspberry Pi 4/5 and ARM NAS). See docs/INSTALL.md › Docker.
# It runs once the Release workflow of the tag succeeded: the container downloads that release's grimorio-data.zip on
# its first start, so the image is only published when the file is there.
name: Docker image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:  # by hand: builds and pushes :dev (nothing tagged latest)

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}  # the v* tag that started the Release run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: v
        run: |
          if [[ "$TAG" == v* ]]; then V="${TAG#v}"; T="ghcr.io/${GITHUB_REPOSITORY,,}:$V,ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          else V=dev; T="ghcr.io/${GITHUB_REPOSITORY,,}:dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "tags=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Grimório — Magic: The Gathering deck builder with Forge AI games
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
